program: ../sf_examples/nethack/train_nethack.py
entity: team-yasd
project: sol-multi
method: grid
metric:
  goal: maximize
  name: reward/reward
command:
  - ${env}
  - python3
  - ${program}
  - ${args_no_boolean_flags}
parameters:
  seed:
    values: [0, 1, 2, 3]
  env:
    value: "minihack_zombie_horde"
  character:
    value: 'mon-hum-neu-mal'
  use_inv_selection_wrapper:
    value: "false"

  model:
    value: "SymbolicGlyphNet"
  map_input_type:
    value: "glyphs"
  crop_dim:
    value: 12
  inv_input_type:
    value: "none"

  with_sol:
    value: "true"
  sol_controller_action_space:
    value: "multidiscrete"
  sol_option_rewards:
    value: "score,score2,score3,health,health2,health3"
  sol_controller_reward_key:
    value: "score"
  sol_controller_reward_scale:
    values: [0.001, 0.0003]
  sol_controller_exploration_scale:
    values: [3.0, 1.0, 0.3]
  sol_num_option_steps:
    value: 16
  reward_scale:
    values: [0.01, 0.003, 0.001]
  reward_scale_score:
    value: 1.0
  reward_scale_health:
    value: 20.0


  batch_size:
    value: 32768
  rollout:
    value: 256
  gamma:
    value: 0.999
  reward_clip:
    value: 10000.0
  with_vtrace:
    value: "true"
  recurrence:
    value: 256
  normalize_returns:
    value: "false"
  exploration_loss_coeff:
    value: 0.003
  value_loss_coeff:
    value: 0.5

  restart_behavior:
    value: "restart"
  train_dir:
    value: "wandb_auto"
  with_wandb:
    value: "True"
  wandb_dir:
    value: "/checkpoint/michaelmatthews/wandb/"
  num_workers:
    value: 48
  num_envs_per_worker:
    value: 40
  experiment_summaries_interval:
    value: 100