program: ../sf_examples/nethack/train_nethack.py
entity: michaelmatthews
project: sf2
method: grid
metric:
  goal: maximize
  name: reward/reward
command:
  - ${env}
  - python3
  - ${program}
  - ${args_no_boolean_flags}
parameters:
  seed:
    values: [0, 1, 2, 3, 4]
  env:
    value: "nethack_challenge"
  character:
    value: "val-dwa-law-fem"
  use_msg_tok:
    value: "true"

  with_gc:
    value: "true"
  gc_goals_path:
    value: "/checkpoint/michaelmatthews/nle_messages/combined/Val-Dwa-Fem-Law/"
  gc_include_ext_reward:
    value: "true"
  gc_terminate_on_success:
    value: "false"
  gc_reward_coeff:
    value: 100
  do_goals_timeout:
    value: "true"
  goal_timeout_turns:
    value: 256
  sample_null_goal_prob:
    value: 0.2
  goal_space_size:
    value: 256
  do_hindsight_experience_replay:
    value: "true"
  hindsight_relabel_traj_prob:
    values: [0.2, 0.4, 0.5, 0.7, 0.9]
  her_burn_in:
    value: 500000000

  model:
    value: "SymbolicGlyphTokenNetGC"
  map_input_type:
    value: "glyphs"
  crop_dim:
    value: 12
  inv_input_type:
    value: "tok"
  tokenizer_name:
    value: "dnd"

  train_for_env_steps:
    value: 50000000000
  batch_size:
    value: 32768
  rollout:
    value: 256
  reward_scale:
    value: 0.01
  gamma:
    value: 0.99
  reward_clip:
    value: 10000.0
  with_vtrace:
    value: "true"
  recurrence:
    value: 256
  normalize_returns:
    value: "false"
  exploration_loss_coeff:
    value: 0.003
  value_loss_coeff:
    value: 0.5

  restart_behavior:
    value: "restart"
  train_dir:
    value: "wandb_auto"
  with_wandb:
    value: "True"
  wandb_dir:
    value: "/checkpoint/michaelmatthews/wandb/"
  num_workers:
    value: 48
  num_envs_per_worker:
    value: 40
  experiment_summaries_interval:
    value: 100
