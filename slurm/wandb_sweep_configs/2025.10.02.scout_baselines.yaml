program: ../sf_examples/nethack/train_nethack.py
entity: team-yasd
project: sol-multi
method: grid
metric:
  goal: maximize
  name: reward/reward
command:
  - ${env}
  - python3
  - ${program}
  - ${args_no_boolean_flags}
parameters:
  seed:
    values: [0, 1, 2, 3, 4]
  env:
    value: "nethack_challenge"
  character:
    values: [
      "ran-hum-neu-fem",
      "wiz-hum-neu-fem",
      "mon-hum-neu-mal",
      "val-dwa-law-fem",
    ]

  model:
    value: "SymbolicTokenNet"
  map_input_type:
    value: "glyphs"
  crop_dim:
    value: 12
  inv_input_type:
    value: "none"
  tokenizer_name:
    value: "dnd"
  use_inv_selection_wrapper:
    value: "true"

  with_sol:
    value: "true"
  sol_multi_num_coefs:
    values: [2]
  sol_multi_coef_spacing:
    values: ["linear"]
  sol_multi_normalise_coefs:
    values: ["true"]
  sol_controller_action_space:
    values: ["discrete", "multidiscrete"]
  sol_option_rewards:
    value: "scout,eating"
  sol_controller_reward_key:
    value: "scout"
  sol_controller_reward_scale:
    value: 0.001
  sol_controller_exploration_scale:
    value: 3.0
  sol_num_option_steps:
    value: -1
  reward_scale:
    value: 0.01
  reward_scale_score:
    value: 1.0
  reward_scale_eating:
    value: 0.03
  reward_scale_health:
    value: 10.0

  train_for_env_steps:
    value: 50000000000
  batch_size:
    value: 32768
  rollout:
    value: 256
  gamma:
    value: 0.999
  reward_clip:
    value: 10000.0
  with_vtrace:
    value: "true"
  recurrence:
    value: 256
  normalize_returns:
    value: "false"
  exploration_loss_coeff:
    value: 0.003
  value_loss_coeff:
    value: 0.5

  restart_behavior:
    value: "restart"
  train_dir:
    value: "wandb_auto"
  with_wandb:
    value: "True"
  wandb_dir:
    value: "/checkpoint/michaelmatthews/wandb/"
  num_workers:
    value: 48
  num_envs_per_worker:
    value: 40
  experiment_summaries_interval:
    value: 100
