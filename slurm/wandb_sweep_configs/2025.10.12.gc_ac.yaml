program: ../sf_examples/nethack/train_nethack.py
entity: michaelmatthews
project: sf2
method: grid
metric:
  goal: maximize
  name: reward/reward
command:
  - ${env}
  - python3
  - ${program}
  - ${args_no_boolean_flags}
parameters:
  seed:
    values: [0, 1, 2, 3, 4]
  env:
    value: "nethack_challenge_no_writing"
  character:
    values: [
#      "ran-hum-neu-fem",
#      "wiz-hum-neu-fem",
      "mon-hum-neu-mal",
#      "val-dwa-law-fem",
    ]

  model:
    value: "SymbolicGlyphTokenNet"
  map_input_type:
    value: "glyphs"
  crop_dim:
    value: 12
  inv_input_type:
    value: "tok"
  tokenizer_name:
    value: "dnd"
  use_inv_selection_wrapper:
    value: "true"


  with_gc:
    value: "true"
  gc_goal_names:
    value: "dlvl_up_score,armor_score"
  gc_include_ext_reward:
    value: "true"
  gc_do_goals_timeout:
    value: "true"
  gc_goal_timeout_turns:
    value: 128
  gc_sample_null_goal_prob:
    value: 0.5
  gc_sample_null_episode_prob:
    value: 0.8
  gc_encode_goals:
    value: "true"

  with_her:
    value: "true"
  her_burn_in:
    value: 0
  her_relabel_traj_prob:
    value: 0.2
  her_relabel_null_episode:
    value: "true"

  reward_scale:
    value: 0.01
  reward_scale_scout:
    value: 1.0
  reward_scale_dlvl_up:
    value: 100.0
  reward_scale_armor:
    values: [20, 50, 100, 200]

  train_for_env_steps:
    value: 50000000000
  batch_size:
    value: 32768
  rollout:
    value: 256
  gamma:
    value: 0.999
  reward_clip:
    value: 10000.0
  with_vtrace:
    value: "true"
  recurrence:
    value: 256
  normalize_returns:
    value: "false"
  exploration_loss_coeff:
    value: 0.003
  value_loss_coeff:
    value: 0.5

  restart_behavior:
    value: "restart"
  train_dir:
    value: "wandb_auto"
  with_wandb:
    value: "True"
  wandb_dir:
    value: "/checkpoint/michaelmatthews/wandb/"
  num_workers:
    value: 48
  num_envs_per_worker:
    value: 40
  experiment_summaries_interval:
    value: 100
