program: ../sf_examples/nethack/train_nethack.py
entity: michaelmatthews
project: sf2
method: grid
metric:
  goal: maximize
  name: reward/reward
command:
  - ${env}
  - python3
  - ${program}
  - ${args_no_boolean_flags}
parameters:
  seed:
    values: [0, 1, 2, 3, 4]
  env:
    value: "nethack_challenge"
  character:
    value: "wiz-hum-neu-fem"

  with_gc:
    value: "true"
  gc_goals_path:
    value: "/checkpoint/michaelmatthews/nle_messages/combined/Val-Dwa-Fem-Law/"
  gc_hardcoded_goals:
    value: "the hit that food really spot,you the food finish eating ration,food ration,you here see food ration,the hits this food really spot,you what to do want or eat,you the corpse finish eating lichen,here is it corpse there jackal eat,here is it corpse there eat newt,here is it corpse there eat gecko,you the corpse jackal finish eating,here is it corpse there eat lichen,you the corpse finish newt eating,you the corpse finish eating gecko"
  gc_include_ext_reward:
    value: "true"
  gc_terminate_on_success:
    value: "false"
  gc_reward_coeff:
    values: [0, 50, 80]
  gc_do_goals_timeout:
    value: "true"
  gc_goal_timeout_turns:
    value: 256
  gc_wait_for_timeout_on_goal_completion:
    value: "true"
  gc_sample_null_goal_prob:
    value: 0.5
  gc_goal_space_size:
    value: 14

  with_her:
    value: "true"
  her_burn_in:
    value: 1000000000
  her_relabel_traj_prob:
    value: 0.9
  her_prioritised_relabelling:
    value: "false"
  her_prioritised_traj_prob:
    value: 0.0
  her_loop_forwards:
    value: "false"

  model:
    value: "SymbolicGlyphTokenNet"
  map_input_type:
    value: "glyphs"
  crop_dim:
    value: 12
  inv_input_type:
    value: "tok"
  tokenizer_name:
    value: "dnd"

  train_for_env_steps:
    value: 50000000000
  batch_size:
    value: 32768
  rollout:
    value: 256
  reward_scale:
    value: 0.01
  gamma:
    value: 0.99
  reward_clip:
    value: 10000.0
  with_vtrace:
    value: "true"
  recurrence:
    value: 256
  normalize_returns:
    value: "false"
  exploration_loss_coeff:
    value: 0.003
  value_loss_coeff:
    value: 0.5

  restart_behavior:
    value: "restart"
  train_dir:
    value: "wandb_auto"
  with_wandb:
    value: "True"
  wandb_dir:
    value: "/checkpoint/michaelmatthews/wandb/"
  num_workers:
    value: 40
  num_envs_per_worker:
    value: 30
  experiment_summaries_interval:
    value: 100
