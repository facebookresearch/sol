program: ../sf_examples/nethack/train_nethack.py
entity: team-yasd
project: sol-multi
method: grid
metric:
  goal: maximize
  name: reward/reward
command:
  - ${env}
  - python3
  - ${program}
  - ${args_no_boolean_flags}
parameters:
  seed:
    values: [0, 1, 2]
  env:
    value: "nethack_score_fixed_eat"
  character:
    values: [
      "mon-hum-neu-mal",
    ]

  model:
    value: "SymbolicGlyphNet"
  map_input_type:
    value: "glyphs"
  crop_dim:
    value: 12
  inv_input_type:
    value: "none"
  use_inv_selection_wrapper:
    value: "false"

  with_sol:
    value: "true"
  sol_option_rewards:
    value: "score,health"
  sol_controller_reward_key:
    value: "score"
  sol_controller_reward_scale:
    value: 0.001
  sol_controller_exploration_scale:
    value: 10.0
  sol_num_option_steps:
    value: -1
  reward_scale:
    value: 0.01
  reward_scale_score:
    value: 1.0
  reward_scale_health:
    value: 10.0

  train_for_env_steps:
    value: 50000000000
  batch_size:
    value: 32768
  rollout:
    value: 256
  gamma:
    value: 0.99
  reward_clip:
    value: 10000.0
  with_vtrace:
    value: "true"
  recurrence:
    value: 256
  normalize_returns:
    value: "false"
  exploration_loss_coeff:
    value: 0.003
  value_loss_coeff:
    value: 0.5

  restart_behavior:
    value: "restart"
  train_dir:
    value: "wandb_auto"
  with_wandb:
    value: "True"
  wandb_dir:
    value: "/checkpoint/michaelmatthews/wandb/"
  num_workers:
    value: 48
  num_envs_per_worker:
    value: 40
  experiment_summaries_interval:
    value: 100
