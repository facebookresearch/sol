env: ['minihack_ring_inv']

with_sol: [False]
with_flat_intrinsic_rewards: [True]

reward_scale: [0.01]
reward_scale_score: [1.0]

#model: ['SymbolicGlyphNet']
#inv_input_type: ["none"]

model: ['SymbolicGlyphTokenNet']
inv_input_type: ["tok"]

glyph_edim: [64]

token_embed_std: [0.001]

inv_encoder_type: ['bow']
inv_query_heads: [4, 8]
#inv_query_std: [0.0001, 0.001, 0.01, 0.1, 1.0]
inv_query_std: [0.1]


character: ['mon-hum-neu-mal']
rollout: [256]
gamma: [0.99]
value_loss_coeff: [0.5]
exploration_loss_coeff: [0.003, 0.01]
reward_clip: [100.0]
map_input_type: ['glyphs']
crop_dim: [12]

num_workers: [16]
num_envs_per_worker: [20]