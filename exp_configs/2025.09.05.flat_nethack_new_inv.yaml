env: ['nethack_challenge']

with_sol: [False]
with_flat_intrinsic_rewards: [True]

reward_scale: [0.01]

reward_scale_score: [1.0]
reward_scale_eating: [0.03, 0.1]

character: [
'mon-hum-neu-mal',
'val-hum-neu-fem',
'ran-hum-neu-mal',
'arc-hum-neu-fem',
'wiz-hum-neu-mal',
'pri-hum-neu-fem',
]

