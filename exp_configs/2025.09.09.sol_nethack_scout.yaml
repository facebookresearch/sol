env: ['nethack_challenge']

with_sol: [True]
sol_option_rewards: ['score,scout,health']
sol_controller_reward_key: ['scout']
sol_controller_reward_scale: [0.001]
sol_controller_exploration_scale: [3.0, 10.0, 30.0]
sol_num_option_steps: [-1]
sol_iso_loss_coeff: [0.0]
sol_bootstrap_on_option_switch: [True]


reward_scale: [0.01]
reward_scale_score: [1.0]
reward_scale_scout: [1.0]
reward_scale_health: [10.0]

character: [
'mon-hum-neu-mal',
'ran-hum-neu-mal',
#'arc-hum-neu-fem',
]

inv_encoder_type: ['att']
inv_query_heads: [4]


rollout: [256]
gamma: [0.99, 0.999]
value_loss_coeff: [0.5]
exploration_loss_coeff: [0.003]
reward_clip: [10000.0]

model: ['SymbolicGlyphTokenNet']
map_input_type: ['glyphs']
inv_input_type: ["tok"]

#model: ['SymbolicGlyphNet']
#map_input_type: ['glyphs']
#inv_input_type: ["none"]


crop_dim: [12]
num_epochs: [1]
batch_size: [32768]
